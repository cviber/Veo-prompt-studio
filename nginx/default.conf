server {
    # Listen on the default port 80
    listen 80;
    server_name localhost;

    # The root directory where our built React app lives
    root /usr/share/nginx/html;
    index index.html index.htm;

    # This is the "magic" for a Single Page Application (SPA).
    # It tries to find the file requested ($uri).
    # If it can't find the file, it tries it as a directory ($uri/).
    # If it still fails, it serves /index.html, letting React Router take over.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: Enable Gzip compression for faster loading
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Optional: Set cache headers for static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public";
    }
}
